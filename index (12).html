<title>Silvora Learning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Concepto: marca Silvora tal como aparece en sus programas (marino, cobre, crema, Cormorant y Plus Jakarta). Una pestaña por mirada: cómo lo hacemos, cada programa y la carrera. */
:root{
--navy:#1F2A44;--bg:#F7F3EF;--surface:#FFFFFF;--surface2:#EFEAE3;--line:#DDD5CA;--grid:#EBE5DC;--ink:#1F2A44;--muted:#5B6478;
--accent:#B87333;--accent-ink:#FFFFFF;--accent-soft:#F3E3D2;--ok:#1E7F4F;--bad:#B42332;--bad-soft:#F8DDE0;--dep:#7B86A6;
--c-es:#4FABA9;--t-es:#2A7F7D;--c-ho:#C76D2E;--t-ho:#A9561C;--c-di:#1F2A44;--t-di:#1F2A44;--c-vi:#B08D5E;--t-vi:#8A6A3E;--on:#FFFFFF;--on-es:#1F2A44;
--b1:#4FABA9;--b2:#C3C3C4;--b3:#C76D2E;--b4:#ECD6BD;
--shadow:0 1px 2px rgba(31,42,68,.06),0 8px 22px rgba(31,42,68,.07);
--f-d:'Cormorant Garamond',Georgia,'Times New Roman',serif;--f-b:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
--wk:16px;--lab:320px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#121A2E;--surface:#1B2640;--surface2:#243152;--line:#2F3C60;--grid:#222E4D;--ink:#F1ECE4;--muted:#A5AEC8;
--accent:#E0975B;--accent-ink:#1A1208;--accent-soft:#3A2B20;--ok:#4CC38A;--bad:#FF7B88;--bad-soft:#3A1B24;--dep:#8C98BA;
--c-es:#5CC0BD;--t-es:#7FD4D1;--c-ho:#E08A4C;--t-ho:#EFA571;--c-di:#8FA6E0;--t-di:#A9BCEE;--c-vi:#D3B183;--t-vi:#E3C79F;--on:#14203A;--on-es:#14203A;
--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#121A2E;--surface:#1B2640;--surface2:#243152;--line:#2F3C60;--grid:#222E4D;--ink:#F1ECE4;--muted:#A5AEC8;
--accent:#E0975B;--accent-ink:#1A1208;--accent-soft:#3A2B20;--ok:#4CC38A;--bad:#FF7B88;--bad-soft:#3A1B24;--dep:#8C98BA;
--c-es:#5CC0BD;--t-es:#7FD4D1;--c-ho:#E08A4C;--t-ho:#EFA571;--c-di:#8FA6E0;--t-di:#A9BCEE;--c-vi:#D3B183;--t-vi:#E3C79F;--on:#14203A;--on-es:#14203A;
--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:14px;line-height:1.5;padding-bottom:56px}
h1,h2,h3,h4,p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--navy);color:#F4EFE8}
.band .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center}
.logo{height:46px;width:auto;display:block;max-width:100%}
.doc{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#C9CFDD;font-weight:600}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.nav button{background:transparent;border:0;border-bottom:3px solid transparent;color:#C9CFDD;padding:10px 16px 11px;text-align:left;white-space:nowrap;display:flex;flex-direction:column;line-height:1.2;border-radius:0}
.nav button b{font-family:var(--f-d);font-size:20px;font-weight:600;color:#F4EFE8}
.nav button small{font-size:11px;letter-spacing:.04em}
.nav button[aria-selected="true"]{border-bottom-color:var(--navc,#C76D2E);background:rgba(255,255,255,.06);color:#fff}
.strip4{height:4px;display:flex}
.strip4 i{flex:1}
main{padding-block:28px 8px;display:flex;flex-direction:column;gap:30px}
h1{font-family:var(--f-d);font-weight:600;font-size:clamp(30px,5vw,52px);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--f-d);font-weight:600;font-size:clamp(24px,3vw,32px);line-height:1.1;text-wrap:balance}
h3{font-size:15px;font-weight:700}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.it{font-family:var(--f-d);font-style:italic;font-weight:500}
.lead{color:var(--muted);max-width:68ch;font-size:15px}
.sec{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.btn{background:var(--navy);color:#F4EFE8;border:0;border-radius:8px;padding:8px 14px;min-height:34px;font-weight:600;font-size:13px}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.fld input,.fld select,.sel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:34px;color:var(--ink);font-weight:500;font-size:13px}
/* program colors */
.p-es{--pc:var(--c-es);--pt:var(--t-es);--po:var(--on-es)}
.p-ho{--pc:var(--c-ho);--pt:var(--t-ho);--po:var(--on)}
.p-di{--pc:var(--c-di);--pt:var(--t-di);--po:var(--on)}
.p-vi{--pc:var(--c-vi);--pt:var(--t-vi);--po:var(--on)}
.p-tr{--pc:#64748B;--pt:var(--muted);--po:#fff}
/* hero */
.hero{background:var(--navy);color:#F4EFE8;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.hero .l{padding:clamp(22px,4vw,44px);display:flex;flex-direction:column;gap:14px;min-width:0}
.hero .r{background:rgba(255,255,255,.06);padding:clamp(20px,3vw,34px);display:flex;flex-direction:column;gap:12px;min-width:0}
.hero .eyebrow{color:#E8A670}
.hero h1{color:#fff}
.hero .desc{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--b1);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero .tag{background:rgba(255,255,255,.14);color:#F4EFE8}
.hero .tagline{font-family:var(--f-d);font-style:italic;font-weight:500;font-size:clamp(20px,2.4vw,27px);line-height:1.25;color:#F4EFE8;text-wrap:balance}
.hero p{color:#D5DAE6;max-width:60ch}
.hero .strip4{border-radius:2px;overflow:hidden;width:96px}
.fact{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:13px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.12)}
.fact:last-child{border-bottom:0;padding-bottom:0}
.fact dt{color:#AEB6CB;font-weight:600}
.fact dd{margin:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.fact .tag{font-size:10px;padding:1px 7px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.verbs{font-family:var(--f-d);font-size:22px;font-weight:600;color:var(--b3)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.naming{padding:18px;display:flex;flex-direction:column;gap:10px}
.alt{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--surface2);border-radius:8px}
.alt b{font-family:var(--f-d);font-size:20px;font-weight:600}
.alt span{font-size:13px;color:var(--muted)}
.hooks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.hooks li{font-family:var(--f-d);font-style:italic;font-size:21px;line-height:1.25;padding-left:14px;border-left:3px solid var(--pc)}
/* classes */
.cls{display:flex;flex-direction:column;gap:12px}
.cl{padding:16px 18px;display:grid;grid-template-columns:54px minmax(0,1fr);gap:4px 16px}
.cl .n{width:46px;height:46px;border-radius:50%;background:var(--pc);color:var(--po);display:flex;align-items:center;justify-content:center;font-family:var(--f-d);font-size:24px;font-weight:700}
.cl .hd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-width:0}
.cl .hd h3{font-family:var(--f-d);font-size:23px;font-weight:600;line-height:1.15}
.cl .bd{grid-column:2;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px 22px;margin-top:6px}
@media (max-width:760px){.cl{grid-template-columns:40px minmax(0,1fr)}.cl .n{width:38px;height:38px;font-size:20px}.cl .bd{grid-column:1 / -1;grid-template-columns:minmax(0,1fr)}}
.cl ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.cl .lab{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pt)}
.take{background:var(--surface2);border-radius:10px;padding:11px 13px;border-left:4px solid var(--pc);display:flex;flex-direction:column;gap:3px}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pp{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px 2px 3px;background:var(--ink);color:var(--bg)}
.pp i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.pp.sup{background:transparent;color:var(--ink);border:1.5px solid var(--ink);padding:1px 9px 1px 2px}
.pp.sup i{background:var(--ink);color:var(--bg)}
.modlab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.box2{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
/* journey */
.path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;position:relative;padding-top:6px}
.path::before{content:"";position:absolute;top:34px;left:12%;right:12%;height:4px;border-radius:2px;background:linear-gradient(to right,var(--c-es),var(--c-ho),var(--c-di),var(--c-vi))}
.stg{display:flex;flex-direction:column;gap:10px;align-items:stretch;position:relative;min-width:0}
.stg .dot{width:56px;height:56px;border-radius:50%;background:var(--pc);color:var(--po);font-family:var(--f-d);font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;align-self:center;border:4px solid var(--bg);position:relative;z-index:1}
.stg .card{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;border-top:4px solid var(--pc)}
.stg h3{font-family:var(--f-d);font-size:26px;font-weight:600;color:var(--pt);line-height:1}
.q{font-family:var(--f-d);font-style:italic;font-size:19px;line-height:1.25}
@media (max-width:860px){.path{grid-template-columns:minmax(0,1fr)}.path::before{display:none}.stg .dot{align-self:flex-start;width:44px;height:44px;font-size:22px}}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.route{padding:16px;display:flex;flex-direction:column;gap:10px}
.route ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.route li{display:flex;gap:10px;align-items:flex-start}
.route li b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.touch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tc{padding:12px 13px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--accent)}
.tc b{font-family:var(--f-d);font-size:20px;font-weight:600}
.tc small{color:var(--muted)}
.thesis{background:var(--navy);color:#F4EFE8;border-radius:14px;padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:10px}
.thesis h2{color:#fff}
.thesis p{color:#D5DAE6;max-width:70ch}
/* paso a paso */
.etapas{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.et{padding:12px 13px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--accent)}
.et b{font-family:var(--f-d);font-size:20px;font-weight:600}
.et small{color:var(--muted);font-size:12px}
.et em{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-d);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)}
.next{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.nx{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.nx:last-child{border-bottom:0}
.nx small{color:var(--muted)}
.nx .id{font-size:11px;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pers{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.pers h3{font-family:var(--f-d);font-size:24px;font-weight:600}
.pers p{font-size:13px;color:var(--muted)}
.bar-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;min-height:34px}
.seg{display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:9px}
.seg button{background:transparent;border:0;border-radius:6px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:flex;gap:6px;align-items:center}
.lg{display:inline-block;width:22px;height:10px;border-radius:3px;background:var(--c-ho)}
.lg.p{opacity:.45;border:1px solid var(--c-ho)}
.lg.e{background:repeating-linear-gradient(135deg,var(--c-ho) 0 4px,color-mix(in srgb,var(--c-ho) 35%,transparent) 4px 8px)}
.lg.d{outline:2px solid var(--bad)}
.lg.m{width:10px;height:10px;transform:rotate(45deg);background:var(--accent);border-radius:2px}
.sw{width:10px;height:10px;border-radius:50%;background:var(--pc);display:inline-block}
.gscroll{overflow:auto;max-height:74vh;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.gin{position:relative;min-width:max-content}
.grow{display:flex;height:var(--rh,40px);border-bottom:1px solid var(--grid)}
.grow .lab{position:sticky;left:0;z-index:3;width:var(--lab);flex:none;background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 10px;border-right:1px solid var(--line);min-width:0;font-size:12.5px}
.grow .tl{position:relative;flex:none;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px);background-size:calc(var(--wk)*4) 100%}
.grow.task{cursor:pointer}
.grow.task:hover,.grow.task:hover .lab{background-color:color-mix(in srgb,var(--surface2) 60%,var(--surface))}
.grow.sel,.grow.sel .lab{background:var(--accent-soft)}
.grow.rel .lab{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.grow.group{background:var(--surface2);--rh:34px}
.grow.group .lab{background:var(--surface2);font-weight:700;cursor:pointer;font-family:var(--f-d);font-size:17px}
.grow.group .tl{background-image:none}
.ghead{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.ghead .grow{border-bottom:0;height:24px}
.ghead .lab{z-index:6;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mo,.wkc{flex:none;text-align:center;font-size:11px;color:var(--muted);border-right:1px solid var(--grid);overflow:hidden;white-space:nowrap}
.mo{font-weight:600;color:var(--ink);text-align:left;padding-left:5px}
.wkc{font-size:9.5px;font-variant-numeric:tabular-nums}
.id{font-size:11px;color:var(--muted);flex:none;width:28px}
.nm{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.pdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--pc)}
.warn{color:var(--bad);font-weight:800;flex:none;cursor:help}
.bar{position:absolute;top:12px;height:16px;border-radius:4px;background:var(--bc);border:1px solid var(--bc)}
.bar.st-p{background:color-mix(in srgb,var(--bc) 30%,var(--surface))}
.bar.st-e{background:repeating-linear-gradient(135deg,var(--bc) 0 5px,color-mix(in srgb,var(--bc) 40%,var(--surface)) 5px 10px)}
.bar.st-b{background:var(--bc);outline:2px solid var(--bad);outline-offset:1px}
.bar.conf{outline:2px solid var(--bad);outline-offset:1px}
.bar.slim{top:14px;height:6px;opacity:.9}
.ms{position:absolute;top:13px;width:14px;height:14px;transform:rotate(45deg);background:var(--accent);border-radius:2px}
.ms.st-c{background:var(--ok)}
.ms.st-p{background:var(--surface);border:2px solid var(--accent)}
.own{position:absolute;top:12px;font-size:11px;color:var(--muted);white-space:nowrap;line-height:16px;font-weight:600}
.pill{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:700;flex:none;background:var(--ink);color:var(--bg)}
svg.deps{position:absolute;top:0;left:var(--lab);pointer-events:none;z-index:2;overflow:visible}
.note{font-size:12px;color:var(--muted);max-width:92ch}
.drawer{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{padding:16px 18px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line)}
.drawer .body{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1}
.drawer .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drawer .fld input,.drawer .fld select{width:100%;min-width:0}
.info{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;background:var(--surface2);border-radius:8px;padding:10px 12px}
.x{background:transparent;border:1px solid var(--line);border-radius:6px;width:32px;height:32px;font-size:16px;line-height:1}
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,12,24,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(900px,100%);max-height:90vh;display:flex;flex-direction:column;gap:12px;padding:18px;overflow:auto}
.mbox textarea{width:100%;height:280px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot{font-size:12px;color:var(--muted);padding-top:8px}

const fin=t=>t.inicio+t.duracion-1;
function compute(tasks,sessions,cap){
  const byId={};tasks.forEach(t=>{byId[t.id]=t});
  const sess=sessions.map(s=>{const d=byId[DICT[s.programa]];return Object.assign({},s,{sem:d?d.inicio+s.n-1:s.n})});
  const lastT=Math.max.apply(null,tasks.map(fin));
  const lastS=Math.max.apply(null,sess.map(s=>s.sem));
  const weeks=Math.max(lastT,lastS)+6;
  const L={};
  PERSONAS.forEach(p=>{L[p]={tarea:Array(weeks+2).fill(0),doc:Array(weeks+2).fill(0),apoyo:Array(weeks+2).fill(0)}});
  tasks.forEach(t=>{
    if(!t.duracion||!t.horas)return;
    const per=t.horas/t.duracion;
    for(let w=t.inicio;w<=fin(t);w++){
      if(L[t.responsable])L[t.responsable].tarea[w]+=per;
      if(t.apoyo!==NONE&&L[t.apoyo])L[t.apoyo].apoyo[w]+=per*APOYO;
    }
  });
  sess.forEach(s=>{
    if(L[s.docente])L[s.docente].doc[s.sem]+=s.horas*(1+PREP);
    if(s.apoyo!==NONE&&L[s.apoyo])L[s.apoyo].apoyo[s.sem]+=SOP;
  });
  const tot=(p,w)=>L[p].tarea[w]+L[p].doc[w]+L[p].apoyo[w];
  const sum=a=>a.reduce((x,y)=>x+y,0);
  const P={};
  PERSONAS.forEach(p=>{
    const live=sess.filter(s=>s.docente===p).reduce((x,s)=>x+s.horas,0);

function header(){
  const nav=TABS.map(t=>`<button role="tab" data-act="tab" data-v="${t[0]}" aria-selected="${U.tab===t[0]}" style="--navc:var(${t[3]})"><b>${t[1]}</b><small>${t[2]}</small></button>`).join('');
  return `<div class="band"><div class="wrap"><div class="brandrow"><img class="logo" src="${LOGO}" alt="Silvora. El futuro. Ahora."><span class="doc">Silvora Learning · Documento de trabajo para revisión interna</span></div><nav class="nav" role="tablist" aria-label="Secciones">${nav}</nav></div><div class="strip4"><i style="background:var(--b1)"></i><i style="background:var(--b2)"></i><i style="background:var(--b3)"></i><i style="background:var(--b4)"></i></div></div>`;
}

/* ---------- Paso a paso ---------- */
function pasoHTML(){
  const all=S.tasks,hs=all.filter(t=>t.hito),ts=all.filter(t=>!t.hito);
  const n=(a,e)=>a.filter(t=>t.estado===e).length;
  const listos=Object.keys(LISTO).filter(p=>C.byId[LISTO[p]].estado==='Completada').length;
  const k=(b,l,c)=>`<div class="card kpi ${c||''}"><b>${b}</b><span>${l}</span></div>`;
  const kp=`<div class="kpis">${k(ts.length,'Pasos')}${k(n(ts,'Completada'),'Completados')}${k(n(ts,'En curso'),'En curso')}${k(n(hs,'Completada')+' de '+hs.length,'Hitos cumplidos')}${k(listos+' de 4','Programas listos para dictar')}${C.depConf.length?k(C.depConf.length,'Pasos fuera de orden','bad'):''}</div>`;
  const ready=t=>t.estado!=='Completada'&&t.deps.every(d=>C.byId[d]&&C.byId[d].estado==='Completada');
  const nx=S.tasks.filter(t=>!t.hito&&(t.estado==='En curso'||ready(t))).sort((a,b)=>(a.estado==='En curso'?0:1)-(b.estado==='En curso'?0:1)||a.inicio-b.inicio).slice(0,6);
  const nxh=nx.length?nx.map(t=>`<button class="nx ${PCLS[t.programa]}" data-act="sel" data-id="${t.id}"><span class="id">${t.id}</span><span><b>${esc(t.tarea)}</b><br><small>Listo cuando: ${esc(t.entregable)}</small></span><span class="tag ${t.estado==='En curso'?'acc':''}">${esc(t.responsable)} · sem. ${t.inicio}</span></button>`).join(''):'<p class="note">No hay pasos listos para empezar.</p>';
  const et=ETAPAS.map((e,i)=>`<div class="card et"><em>ETAPA ${i+1}</em><b>${e[0]}</b><small>${e[1]}</small></div>`).join('');
  const per=[['Virginia','Estrategia y gobierno académico, apertura de cada programa, conducción de IA para Dirección, precios y alianzas.'],['Cristina','Plataforma, inscripción y cobros, modelo financiero, la parte técnica de IA Hands-on, datos y riesgo.'],['Agustina','Naming y marca, landings y campañas, IA Essentials, prompting y asistentes en los programas y el hilo humano de Vigencia.']].map(([p,d])=>{
    const r=S.tasks.filter(t=>t.responsable===p).length,a=S.tasks.filter(t=>t.apoyo===p).length;
    return `<div class="card pers"><h3>${p}</h3><p>${d}</p><span class="tag" style="align-self:flex-start">${r} pasos a cargo · ${a} de apoyo</span></div>`}).join('');
  const f=U.f;
  const tools=`<div class="bar-tools"><div class="seg" role="group" aria-label="Agrupar"><button data-act="grp" data-v="etapa" aria-pressed="${U.group==='etapa'}">Por etapa</button><button data-act="grp" data-v="programa" aria-pressed="${U.group==='programa'}">Por programa</button></div>
<div class="filters"><label class="fld">Programa<select data-fil="prog">${opt(['Todos',...PROGRAMAS],f.prog)}</select></label><label class="fld">Etapa<select data-fil="fase">${opt(['Todas',...Object.values(FASES)],f.fase)}</select></label><label class="fld">Responsable<select data-fil="pers">${opt(['Todas',...PERSONAS],f.pers)}</select></label><label class="fld">Estado<select data-fil="est">${opt(['Todos',...ESTADOS],f.est)}</select></label><label class="chk"><input type="checkbox" data-act="deps" ${U.deps?'checked':''}> Mostrar dependencias</label></div></div>`;
  const leg=`<div class="legend"><span><i class="lg p"></i>Pendiente</span><span><i class="lg e"></i>En curso</span><span><i class="lg"></i>Completado</span><span><i class="lg d"></i>Bloqueado o fuera de orden</span><span><i class="lg m"></i>Hito</span>${['IA Essentials','Hands-on','Dirección','Vigencia'].map(p=>`<span><i class="sw" style="background:var(${PVAR[p]})"></i>${p===COMM[p]?p:p+' ('+COMM[p]+')'}</span>`).join('')}</div>`;
  return `<section class="sec"><span class="eyebrow">Cómo lo hacemos</span><h1>Paso a paso para lanzar Silvora Learning</h1><p class="lead">Siete etapas, cuatro programas y tres personas. Cada paso tiene un responsable provisional, una semana de inicio y un criterio de "listo cuando". Las semanas son relativas: no hay fechas oficiales de lanzamiento. Podés cargar una fecha de inicio para ver fechas reales.</p>

function headHTML(W){let mo='',wk='';for(let m=0;m<Math.ceil(W/4);m++){mo+=`<div class="mo" style="width:${4*WK}px">Mes ${m+1}${S.start?' · '+wkDate(m*4+1).replace(/ \d{4}$/,''):''}</div>`}for(let w=1;w<=W;w++)wk+=`<div class="wkc" style="width:${WK}px">${w}</div>`;
  return `<div class="ghead"><div class="grow"><div class="lab">Mes</div><div class="tl" style="width:${W*WK}px;display:flex;background-image:none">${mo}</div></div><div class="grow"><div class="lab">Paso · semana</div><div class="tl" style="width:${W*WK}px;display:flex;background-image:none">${wk}</div></div></div>`}
function taskRow(t){
  const x=(t.inicio-1)*WK,w=t.duracion*WK-2,conf=C.depConf.some(c=>c.id===t.id),st=ST[t.estado]||'p',col=`var(${PVAR[t.programa]})`;

  const sel=U.sel===t.id?' sel':(U.sel&&C.byId[U.sel]&&(C.byId[U.sel].deps.includes(t.id)||t.deps.includes(U.sel))?' rel':'');
  return {h:ROWH,id:t.id,html:`<div class="grow task${sel}" data-act="sel" data-id="${t.id}" style="--rh:${ROWH}px"><div class="lab ${PCLS[t.programa]}"><span class="pdot"></span><span class="id">${t.id}</span><span class="nm" title="${esc(t.tarea)}">${esc(t.tarea)}</span>${conf?'<span class="warn" title="Empieza antes de que termine un paso previo">!</span>':''}<span class="pill" title="${esc(t.responsable)}">${ini(t.responsable)}</span></div><div class="tl" style="width:__W__px">${bar}${own}</div></div>`};
}
function groupRow(key,label,cls,items){
  const mn=Math.min(...items.map(t=>t.inicio)),mx=Math.max(...items.map(fin));
  return {h:34,html:`<div class="grow group" data-act="tog" data-key="${esc(key)}"><div class="lab ${cls}"><span class="pdot"></span><span class="nm" style="-webkit-line-clamp:1">${U.col[key]?'▸':'▾'} ${esc(label)}</span><small style="color:var(--muted);font-weight:500;font-family:var(--f-b);font-size:12px">${items.length}</small></div><div class="tl" style="width:__W__px"><span class="bar slim" style="left:${(mn-1)*WK}px;width:${(mx-mn+1)*WK-2}px;--bc:var(--accent)"></span></div></div>`};
}
function ganttView(){
  const rows=[];
  if(U.group==='etapa'){
    Object.keys(FASES).forEach(f=>{const ts=S.tasks.filter(t=>t.fase==+f&&passes(t)).sort((a,b)=>a.inicio-b.inicio||a.id.localeCompare(b.id));if(!ts.length)return;rows.push(groupRow('e'+f,'Etapa '+FASES[f],'p-tr',ts));if(!U.col['e'+f])ts.forEach(t=>rows.push(taskRow(t)))});
  }else{
    PROGRAMAS.forEach(p=>{const ts=S.tasks.filter(t=>t.programa===p&&passes(t)).sort((a,b)=>a.inicio-b.inicio||a.id.localeCompare(b.id));if(!ts.length)return;rows.push(groupRow('g'+p,p+(COMM[p]?' · '+COMM[p]:''),PCLS[p],ts));if(!U.col['g'+p])ts.forEach(t=>rows.push(taskRow(t)))});
  }
  if(!rows.length)return '<p class="note">Ningún paso coincide con los filtros.</p>';
  const W=C.weeks;let y=0;const yp={};rows.forEach(r=>{if(r.id)yp[r.id]=y+r.h/2;y+=r.h});
  const pairs=[];S.tasks.forEach(t=>{if(yp[t.id]===undefined)return;t.deps.forEach(d=>{if(yp[d]===undefined)return;if(U.deps||U.sel===t.id||U.sel===d)pairs.push([C.byId[d],t])})});
  const paths=pairs.map(([a,b])=>{const x1=a.hito?(a.inicio-1)*WK+WK/2+8:fin(a)*WK-2,x2=b.hito?(b.inicio-1)*WK+WK/2-8:(b.inicio-1)*WK,y1=yp[a.id],y2=yp[b.id],bad=b.inicio<=fin(a),c=bad?'var(--bad)':'var(--dep)';
    const d=x2>=x1+10?`M${x1} ${y1}H${x1+5}V${y2}H${x2-2}`:`M${x1} ${y1}H${x1+5}V${(y1+y2)/2}H${x2-6}V${y2}H${x2-2}`;
    return `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.3"/><path d="M${x2-2} ${y2}l-4 -3v6z" fill="${c}"/>`}).join('');
  return `<div class="gscroll" id="gs"><div class="gin" style="--wk:${WK}px">${headHTML(W)}<div style="position:relative">${rows.map(r=>r.html.replace(/__W__/g,W*WK)).join('')}<svg class="deps" width="${W*WK}" height="${y}" aria-hidden="true">${paths}</svg></div></div></div>`;
}

  const rows=[h].concat(S.tasks.map(t=>[t.id,t.programa,FASES[t.fase],t.eje,t.tarea,t.responsable,t.apoyo,t.inicio,fin(t),t.duracion,wkDate(t.inicio),wkDate(fin(t),true),t.deps.join(' '),t.prioridad,t.estado,t.entregable,t.hito?'Sí':'No']));
  if(U.exp.fmt==='tsv')return rows.map(r=>r.map(c=>String(c).replace(/[\t\n\r]+/g,' ')).join('\t')).join('\n');
  return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
}
function exportHTML(){
  if(!U.exp.open)return '';
  return `<div class="modal" data-act="mclose"><div class="mbox" role="dialog" aria-label="Exportar pasos"><div class="row" style="justify-content:space-between"><h3 style="font-family:var(--f-d);font-size:22px">Exportar los pasos del plan</h3><button class="x" data-act="mclose2" aria-label="Cerrar">×</button></div>
<div class="seg" style="align-self:flex-start"><button data-act="efmt" data-v="tsv" aria-pressed="${U.exp.fmt==='tsv'}">Para pegar en Excel o Sheets</button><button data-act="efmt" data-v="csv" aria-pressed="${U.exp.fmt==='csv'}">CSV</button></div>
<p class="note">Este visor no permite descargas directas. Copiá el texto y pegalo en una hoja de cálculo.</p><textarea id="exptxt" readonly>${esc(expText())}</textarea><div class="row"><button class="btn acc" data-act="copy">Copiar al portapapeles</button><span class="note" id="expmsg">${esc(U.exp.msg)}</span></div></div></div>`;
}
/* ---------- Render ---------- */
function render(){
  sync();C=compute(S.tasks,S.sessions,CAP);
  const gs=$('#gs');const st=gs?[gs.scrollLeft,gs.scrollTop]:null;const ws=window.scrollY;
  let body;
  if(U.tab==='paso-a-paso')body=pasoHTML();
  else if(U.tab==='journey')body=journeyHTML();
  else body=progHTML(BP.find(b=>b.tab===U.tab));
  $('#app').innerHTML=header()+`<main class="wrap">${body}<p class="foot">Documento de trabajo para revisión interna. Nombres, responsables, plazos y orden de lanzamiento son propuestas a validar por el equipo fundador, no acuerdos confirmados.</p></main>`+drawerHTML()+exportHTML();
  const g=$('#gs');if(g&&st){g.scrollLeft=st[0];g.scrollTop=st[1]}
  window.scrollTo(0,ws);
}
function go(tab,keep){U.tab=tab;U.sel=null;if(!keep){try{history.replaceState(null,'','#'+tab)}catch(e){location.hash=tab}}render();if(!keep)window.scrollTo(0,0)}
function update(){save();render()}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='mclose'&&e.target!==el)return;
  if(a==='tab')go(el.dataset.v);
  else if(a==='grp'){U.group=el.dataset.v;render()}
  else if(a==='sel'){U.sel=U.sel===el.dataset.id?null:el.dataset.id;render()}
  else if(a==='close'){U.sel=null;render()}
  else if(a==='tog'){U.col[el.dataset.key]=!U.col[el.dataset.key];render()}
  else if(a==='export'){U.exp.open=true;U.exp.msg='';render()}
  else if(a==='mclose'||a==='mclose2'){U.exp.open=false;render()}
  else if(a==='efmt'){U.exp.fmt=el.dataset.v;U.exp.msg='';render()}
  else if(a==='reset'){if(el.dataset.ok){S=fresh();U.sel=null;update()}else{el.dataset.ok='1';el.textContent='Confirmar: se pierden tus cambios';setTimeout(()=>{if(el.isConnected){delete el.dataset.ok;el.textContent='Restablecer plan'}},4000)}}
  else if(a==='copy'){const ta=$('#exptxt'),setMsg=m=>{U.exp.msg=m;const x=$('#expmsg');if(x)x.textContent=m};const fb=()=>{ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(err){}setMsg(ok?'Copiado.':'Texto seleccionado. Copialo con Ctrl+C o Cmd+C.')};try{navigator.clipboard.writeText(ta.value).then(()=>setMsg('Copiado.'),fb)}catch(err){fb()}}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='start'){S.start=el.value;update();return}
  if(el.dataset.fil){U.f[el.dataset.fil]=el.value;render();return}
  if(el.dataset.act==='deps'){U.deps=el.checked;render();return}
  if(el.dataset.f&&U.sel){const t=S.tasks.find(x=>x.id===U.sel),f=el.dataset.f;if(!t)return;
    if(f==='inicio')t.inicio=Math.max(1,Math.round(+el.value)||1);
    else if(f==='duracion')t.duracion=Math.max(1,Math.round(+el.value)||1);
    else if(f==='deps'){const ids=el.value.split(/[\s,;]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);t.deps=ids.filter((d,i)=>S.tasks.some(x=>x.id===d)&&d!==t.id&&ids.indexOf(d)===i)}
    else t[f]=el.value;
    update()}
});
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(TABS.some(t=>t[0]===h)&&h!==U.tab){go(h,true)}});
const h0=location.hash.replace('#','');if(TABS.some(t=>t[0]===h0))U.tab=h0;
render();
})();
</script>
